name: PostgreSQL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The repository's historical unanchored "bin/" and "data/" ignore
      # rules omitted these source directories from the initial import.
      # Restore them from the exact upstream release before building.
      - name: Restore omitted upstream sources
        run: |
          curl --fail --location --silent --show-error \
            https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2 \
            --output /tmp/postgresql-18.3.tar.bz2
          tar -xjf /tmp/postgresql-18.3.tar.bz2 \
            -C . --strip-components=1 \
            postgresql-18.3/src/bin \
            postgresql-18.3/src/pl/plpgsql/src/data \
            postgresql-18.3/src/test/regress/data \
            postgresql-18.3/src/timezone/data

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison flex libreadline-dev zlib1g-dev

      - name: Configure assertion build
        run: |
          ./configure \
            --enable-cassert \
            --enable-debug \
            --without-icu

      - name: Build PostgreSQL
        run: make -j2 world-bin

      - name: Check catalog OIDs
        run: perl src/include/catalog/duplicate_oids

      - name: Run core regression tests
        run: make -C src/test/regress check

      - name: Run isolation tests
        run: make -C src/test/isolation check

      - name: Upload test diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-diffs
          path: |
            tmp_install/log/
            src/test/regress/regression.diffs
            src/test/regress/log/
            src/test/isolation/output_iso/
          if-no-files-found: ignore
